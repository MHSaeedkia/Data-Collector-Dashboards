services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    hostname: prometheus
    restart: on-failure
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nifi-token:/etc/prometheus/secrets:ro
      - monitoring-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  nifi-token-refresher:
    image: curlimages/curl:8.10.1
    container_name: nifi-token-refresher
    restart: unless-stopped
    user: root
    environment:
      NIFI_URL: "https://nifi:8443"
      NIFI_USER: "admin"
      NIFI_PASS: "admin123456789"
      REFRESH_INTERVAL: "21600"
    volumes:
      - nifi-token:/secrets
      - ./prometheus/refresh_token.sh:/refresh_token.sh:ro
    entrypoint: [ "/bin/sh", "/refresh_token.sh" ]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    hostname: grafana
    restart: on-failure
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123456789
      # --- SMTP / Email alerting ---
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${GF_SMTP_HOST}"
      GF_SMTP_USER: "${GF_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS}"
      GF_SMTP_FROM_NAME: "Grafana Alerts"
      GF_SMTP_SKIP_VERIFY: "false"
      GF_DATABASE_WAL: "true"
    volumes:
      - monitoring-grafana-data:/var/lib/grafana

  alert-gateway:
    build:
      context: ./alert-gateway
    container_name: alert-gateway
    hostname: alert-gateway
    restart: on-failure
    ports:
      - "8085:8080"
    env_file:
      - ./alert-gateway/.env
    environment:
      LISTEN_ADDR: ":8080"
      CONFIG_PATH: "/app/config/config.yaml"
    volumes:
      - ./alert-gateway/config/config.yaml:/app/config/config.yaml:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    hostname: loki
    restart: on-failure
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - monitoring-loki-data:/loki
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    hostname: alloy
    restart: on-failure
    depends_on:
      loki:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      # Alloy's own UI — the place to look when logs are not arriving in Loki.
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - nifi-logs:/nifi-logs:ro
      - monitoring-alloy-data:/var/lib/alloy/data

volumes:
  monitoring-prometheus-data:
  monitoring-grafana-data:
  monitoring-loki-data:
  monitoring-alloy-data:
  nifi-token:
  # Owned by the data-collector project; mounted read-only just to read its logs.
  # Nothing here creates or manages it — `docker volume ls` to confirm the name.
  nifi-logs:
    external: true
    name: "data-collector_data-collector-nifi-logs"

networks:
  # The monitoring stack has no network of its own: its default network IS the
  # data-collector project's network. Every service here therefore resolves
  # kafka, nifi, postgres, lpa-staleness-exporter, jobmanager, ... by service
  # name, and the data-collector services can reach back the same way.
  #
  # Consequence: data-collector must be up FIRST. Compose will not create an
  # external network, so starting this stack alone fails with
  # "network ... declared as external, but could not be found".
  default:
    external: true
    name: "data-collector_data-collector-net"
