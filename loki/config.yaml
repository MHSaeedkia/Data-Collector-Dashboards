# Single-binary Loki with filesystem storage. Sized for one NiFi node, not a cluster.
# If this ever needs to scale out, that is the point to move to object storage.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki is chatty at info; its own logs would drown the container output.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 360h = 15d, deliberately matching prometheus' --storage.tsdb.retention.time=15d
  # so a dashboard never shows metrics for a window that has no logs.
  retention_period: 360h
  # NiFi is chatty. These caps stop a DEBUG-level flood from filling the disk;
  # if they are hit, Alloy logs 429s and you should fix the log level, not raise these.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  allow_structured_metadata: true

# Retention is only actually enforced when the compactor runs it.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
